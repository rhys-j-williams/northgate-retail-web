<cn-dialog-shell title="Cancel this payment?" i18n-title="@@billPay.cancelPayment.title" [busy]="busy" [destructive]="true">
  <p i18n="@@billPay.cancelPayment.body">The payee will not receive this payment. Any late fees are between you and the payee.</p>
  <mol-error-banner [error]="error" [showRetry]="false"></mol-error-banner>
  <div class="mol-flex-row mol-gap-8 mol-justify-end mol-align-stretch" cnDialogActions>
    <cn-button variant="tertiary" (pressed)="ref.close(false)" i18n="@@action.cancel">Cancel</cn-button>
    <cn-button variant="destructive" [loading]="busy" (pressed)="confirm()" i18n="@@billPay.cancelPayment.confirm">Cancel payment</cn-button>
  </div>
</cn-dialog-shell>
