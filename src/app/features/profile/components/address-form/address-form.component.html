<cn-page-header title="Mailing address" i18n-title="@@profile.addressForm.title" lede="Cards and paper statements go here. A new address takes effect after we verify it, usually within 1 business day." i18n-lede="@@profile.addressForm.lede" [backLink]="'/profile'"></cn-page-header>

<form class="mol-page mol-form mol-flex-col mol-gap-16" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <cn-error-summary [form]="form" *ngIf="submitted && form.invalid"></cn-error-summary>
  <mol-error-banner [error]="error" [showRetry]="false"></mol-error-banner>

  <cn-card [padded]="true">
    <div class="mol-flex-row mol-flex-col--lt-md mol-gap-16">
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@profile.address.line1">Address line 1</mat-label>
        <input matInput formControlName="line1" molTrimOnBlur maxlength="80" autocomplete="address-line1">
        <mat-error *ngIf="form.get('line1')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@profile.address.line2">Address line 2</mat-label>
        <input matInput formControlName="line2" molTrimOnBlur maxlength="80" autocomplete="address-line2">
        <mat-error *ngIf="form.get('line2')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
    </div>
    <div class="mol-flex-row mol-flex-col--lt-md mol-gap-16">
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@profile.address.city">City</mat-label>
        <input matInput formControlName="city" molTrimOnBlur maxlength="60" >
        <mat-error *ngIf="form.get('city')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@profile.address.state">State</mat-label>
        <input matInput formControlName="state" molTrimOnBlur maxlength="2" >
        <mat-error *ngIf="form.get('state')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
    </div>
    <div class="mol-flex-row mol-flex-col--lt-md mol-gap-16">
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@profile.address.zip">ZIP code</mat-label>
        <input matInput formControlName="postalCode" molTrimOnBlur maxlength="10" autocomplete="postal-code">
        <mat-error *ngIf="form.get('postalCode')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
    </div>
  </cn-card>

  <div class="mol-flex-row mol-flex-col--lt-md mol-gap-8 mol-justify-end mol-align-stretch">
    <cn-button variant="tertiary" type="button" (pressed)="cancel()" i18n="@@action.cancel">Cancel</cn-button>
    <cn-button variant="primary" type="submit" [loading]="saving" i18n="@@profile.addressForm.submit">Save address</cn-button>
  </div>
</form>
