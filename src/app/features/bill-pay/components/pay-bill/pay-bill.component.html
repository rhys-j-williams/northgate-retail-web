<cn-page-header title="Pay a bill" i18n-title="@@billPay.payBill.title" lede="Payments sent before 5:00 PM ET are processed the same business day." i18n-lede="@@billPay.payBill.lede" [backLink]="'/bill-pay'"></cn-page-header>

<form class="mol-page mol-form mol-flex-col mol-gap-16" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <cn-error-summary [form]="form" *ngIf="submitted && form.invalid"></cn-error-summary>
  <mol-error-banner [error]="error" [showRetry]="false"></mol-error-banner>

  <cn-card [padded]="true">
    <div class="mol-flex-row mol-flex-col--lt-md mol-gap-16">
      <cn-select class="mol-flex" formControlName="fromAccountId" i18n-label="@@billPay.pay.from" label="Pay from" [options]="fromAccountIdOptions" [required]="true"></cn-select>
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@billPay.pay.amount">Amount</mat-label>
        <cn-currency-input formControlName="amountMinor" [min]="0"></cn-currency-input>
        <mat-error *ngIf="form.get('amountMinor')?.hasError('required')" i18n="@@validation.amountRequired">Enter an amount</mat-error>
      </mat-form-field>
    </div>
    <div class="mol-flex-row mol-flex-col--lt-md mol-gap-16">
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@billPay.pay.sendOn">Send on</mat-label>
        <input matInput formControlName="sendOn" type="date" [min]="today">
      </mat-form-field>
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@billPay.pay.memo">Memo (appears on your statement)</mat-label>
        <input matInput formControlName="memo" molTrimOnBlur maxlength="60" >
        <mat-error *ngIf="form.get('memo')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
    </div>
  </cn-card>

  <div class="mol-flex-row mol-flex-col--lt-md mol-gap-8 mol-justify-end mol-align-stretch">
    <cn-button variant="tertiary" type="button" (pressed)="cancel()" i18n="@@action.cancel">Cancel</cn-button>
    <cn-button variant="primary" type="submit" [loading]="saving" i18n="@@billPay.payBill.submit">Schedule payment</cn-button>
  </div>
</form>
