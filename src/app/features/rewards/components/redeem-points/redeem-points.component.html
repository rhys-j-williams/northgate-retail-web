<cn-page-header title="Redeem points" i18n-title="@@rewards.redeemPoints.title" lede="Statement credits post within 2 business days. Deposits to a Northgate account are same day." i18n-lede="@@rewards.redeemPoints.lede" [backLink]="'/rewards'"></cn-page-header>

<form class="mol-page mol-form mol-flex-col mol-gap-16" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <cn-error-summary [form]="form" *ngIf="submitted && form.invalid"></cn-error-summary>
  <mol-error-banner [error]="error" [showRetry]="false"></mol-error-banner>

  <cn-card [padded]="true">
    <div class="mol-flex-row mol-flex-col--lt-md mol-gap-16">
      <cn-select class="mol-flex" formControlName="optionId" i18n-label="@@rewards.redeem.option" label="Redeem for" [options]="optionIdOptions" [required]="true"></cn-select>
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@rewards.redeem.points">Points to redeem</mat-label>
        <input matInput formControlName="points" molTrimOnBlur maxlength="7" >
        <mat-error *ngIf="form.get('points')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
    </div>
  </cn-card>

  <div class="mol-flex-row mol-flex-col--lt-md mol-gap-8 mol-justify-end mol-align-stretch">
    <cn-button variant="tertiary" type="button" (pressed)="cancel()" i18n="@@action.cancel">Cancel</cn-button>
    <cn-button variant="primary" type="submit" [loading]="saving" i18n="@@rewards.redeemPoints.submit">Redeem</cn-button>
  </div>
</form>
