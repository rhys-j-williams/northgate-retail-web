<cn-page-header title="New message" i18n-title="@@messages.composeMessage.title" lede="Do not include your full card number or password. We will never ask for them here." i18n-lede="@@messages.composeMessage.lede" [backLink]="'/messages'"></cn-page-header>

<form class="mol-page mol-form mol-flex-col mol-gap-16" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <cn-error-summary [form]="form" *ngIf="submitted && form.invalid"></cn-error-summary>
  <mol-error-banner [error]="error" [showRetry]="false"></mol-error-banner>

  <cn-card [padded]="true">
    <div class="mol-flex-row mol-flex-col--lt-md mol-gap-16">
      <cn-select class="mol-flex" formControlName="topic" i18n-label="@@messages.compose.topic" label="Topic" [options]="topicOptions" [required]="true"></cn-select>
      <mat-form-field class="mol-flex" appearance="outline">
        <mat-label i18n="@@messages.compose.subject">Subject</mat-label>
        <input matInput formControlName="subject" molTrimOnBlur maxlength="120" >
        <mat-error *ngIf="form.get('subject')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
    </div>
    <div class="mol-flex-row mol-flex-col--lt-md mol-gap-16">
      <mat-form-field class="mol-flex-100" appearance="outline">
        <mat-label i18n="@@messages.compose.body">Message</mat-label>
        <textarea matInput formControlName="body" rows="4" maxlength="4000"></textarea>
        <mat-hint align="end">{{ form.get('body')?.value?.length || 0 }}/4000</mat-hint>
      </mat-form-field>
    </div>
  </cn-card>

  <div class="mol-flex-row mol-flex-col--lt-md mol-gap-8 mol-justify-end mol-align-stretch">
    <cn-button variant="tertiary" type="button" (pressed)="cancel()" i18n="@@action.cancel">Cancel</cn-button>
    <cn-button variant="primary" type="submit" [loading]="saving" i18n="@@messages.composeMessage.submit">Send message</cn-button>
  </div>
</form>
