<cn-page-header title="Bill" i18n-title="@@billPay.billDetail.title" [backLink]="'/bill-pay'"></cn-page-header>

<div class="mol-page mol-flex-col mol-gap-16" *ngIf="item$ | async as item; else loading">
  <cn-card [padded]="true">
    <dl class="mol-dl">
      <div class="mol-dl__row mol-flex-row mol-flex-col--lt-md mol-gap-16">
        <dt class="mol-flex-basis-220" i18n="@@billPay.billDetail.payee">Payee</dt>
        <dd class="mol-flex">{{ item.payeeName }}</dd>
      </div>
      <div class="mol-dl__row mol-flex-row mol-flex-col--lt-md mol-gap-16">
        <dt class="mol-flex-basis-220" i18n="@@billPay.billDetail.amount">Amount due</dt>
        <dd class="mol-flex">{{ item.amountDueMinor | minorAmount }}</dd>
      </div>
      <div class="mol-dl__row mol-flex-row mol-flex-col--lt-md mol-gap-16">
        <dt class="mol-flex-basis-220" i18n="@@billPay.billDetail.due">Due date</dt>
        <dd class="mol-flex">{{ item.dueAt | date:'longDate' }}</dd>
      </div>
      <div class="mol-dl__row mol-flex-row mol-flex-col--lt-md mol-gap-16">
        <dt class="mol-flex-basis-220" i18n="@@billPay.billDetail.status">Status</dt>
        <dd class="mol-flex">{{ item.status | translate }}</dd>
      </div>
      <div class="mol-dl__row mol-flex-row mol-flex-col--lt-md mol-gap-16">
        <dt class="mol-flex-basis-220" i18n="@@billPay.billDetail.ebill">eBill</dt>
        <dd class="mol-flex">{{ item.ebill ? 'On' : 'Off' }}</dd>
      </div>
      <div class="mol-dl__row mol-flex-row mol-flex-col--lt-md mol-gap-16">
        <dt class="mol-flex-basis-220" i18n="@@billPay.billDetail.autopay">Autopay</dt>
        <dd class="mol-flex">{{ item.autopay ? 'On' : 'Off' }}</dd>
      </div>
    </dl>
  </cn-card>
</div>
<ng-template #loading>
  <mol-loading-panel [rows]="5"></mol-loading-panel>
</ng-template>
